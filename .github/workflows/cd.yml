name: Syllog CD

on:
  push:
    tags:
      # Triggers on Semantic Versioning tags (e.g. v1.0.0, v0.1.0-alpha.1)
      - 'v*.*.*'

# Strict permissions following the Principle of Least Privilege
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. Build and Package Release Binaries across Target Architectures
  # ============================================================================
  build-binaries:
    name: 📦 Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: syllog-x86_64-unknown-linux-gnu
            asset_name: syllog-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: syllog-x86_64-pc-windows-msvc
            asset_name: syllog-x86_64-pc-windows-msvc.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: syllog-x86_64-apple-darwin
            asset_name: syllog-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: syllog-aarch64-apple-darwin
            asset_name: syllog-aarch64-apple-darwin.tar.gz

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: 🛠️ Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 📦 Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} syllog
          cd ../../..

      - name: 📦 Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\syllog.exe" -DestinationPath "${{ matrix.asset_name }}"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  # ============================================================================
  # 2. Generate Release and Attach Compressed Artifacts
  # ============================================================================
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 📋 Flatten Artifact Directory
        run: |
          mkdir release_assets
          find artifacts/ -type f -exec cp {} release_assets/ \;

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          # Automatically marks pre-releases for tags containing hyphens (e.g. v1.0.0-rc.1)
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# Cargo.toml
[package]
name = "syllog"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "A lightweight, zero-allocation Reverse Polish Notation (RPN) logic evaluator"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/LuizFelipe-tech/syllog"
keywords = ["rpn", "evaluator", "logic", "cli", "parser"]
categories = ["command-line-utilities", "parsing"]

[[bin]]
name = "rpn_engine"
path = "src/main.rs"

# ==============================================================================
# Compiler and Linter Configurations
# ==============================================================================

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"

clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
mutex_integer = "warn"
large_types_passed_by_value = "warn"
string_to_string = "warn"
inefficient_to_string = "warn"
same_name_method = "warn"
str_to_string = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
expl_impl_clone_on_copy = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# ==============================================================================
# Performance and Binary Optimization Profiles
# ==============================================================================

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
thiserror = "2.0.20"

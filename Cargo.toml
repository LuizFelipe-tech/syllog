[package]
name = "syllog"
version = "0.1.0"
edition = "2024"
description = "A lightweight, zero-allocation Reverse Polish Notation (RPN) logic evaluator"
license = "pache-2.0"
readme = "README.md"
repository = "https://github.com/LuizFelipe-tech/syllog"
keywords = ["rpn", "evaluator", "logic", "cli", "parser"]
categories = ["command-line-utilities", "parsing"]

[[bin]]
name = "rpn_engine"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"

# ==============================================================================
# Compiler and Linter Configurations
# ==============================================================================

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Configures base linter groups with low priority to allow explicit overrides below.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Configures lints for defensive programming and panic prevention.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"

# Configures lints for memory allocation and pointer optimization.
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
mutex_integer = "warn"
large_types_passed_by_value = "warn"
string_to_string = "warn"
inefficient_to_string = "warn"
same_name_method = "warn"
str_to_string = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
expl_impl_clone_on_copy = "warn"

# Defines intentional overrides specific to the internal project architecture.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# ==============================================================================
# Performance and Binary Optimization Profiles
# ==============================================================================

[profile.release]
opt-level = 3            # Maximum optimization level.
lto = "fat"              # Cross-crate Link-Time Optimization.
codegen-units = 1        # Minimizes compilation units for maximum LLVM optimization.
panic = "abort"          # Disables stack unwinding for minimal binary size and speed.
strip = true             # Removes all debug symbols from compiled binary.
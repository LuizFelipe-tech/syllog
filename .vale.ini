# Core Settings
StylesPath = styles
MinAlertLevel = suggestion
Packages = Google, proselint
Vocab = Syllog

# Global Scope Controls
IgnoredScopes = code, tt
IgnoredClasses = rust, rs

# ==============================================================================
# Documentation & Prose Markup (*.md, *.txt)
# ==============================================================================

[*.{md,txt}]
BasedOnStyles = Vale, Google, proselint

# Anchor frontmatter to SOF (\A) to prevent collisions with Markdown horizontal rules (---)
# Ignore LaTeX display ($$...$$) and non-greedy single-line inline math ($...$)
BlockIgnores = (?s)(\A---.*?---), (?s)(\$\$.*?\$\$)
TokenIgnores = (\$[^\$\n]+?\$)

# Severity Overrides
Google.Passive = warning
Google.We = suggestion
Google.Wordiness = warning

# ==============================================================================
# Rust Source Code Comments (*.rs)
# ==============================================================================

[*.rs]
BasedOnStyles = Vale, Google

# Ignore fenced code blocks within rustdoc comments
BlockIgnores = (?s)(```.*?```)

# Technical prose adjustments
Google.Passive = suggestion
Google.We = OFF
Google.Wordiness = suggestion
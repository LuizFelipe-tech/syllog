# .vale.ini
# Core Settings
StylesPath = styles
MinAlertLevel = suggestion
Packages = Google, proselint
Vocab = Syllog

# Global Scope Controls
# Added 'kbd' and 'samp' to align with Vale's defaults and Google's tech docs standard
IgnoredScopes = code, tt, kbd, samp
IgnoredClasses = rust, rs

# ==============================================================================
# Documentation & Prose Markup (*.md, *.txt)
# ==============================================================================

[*.{md,txt}]
BasedOnStyles = Vale, Google, proselint

# Anchor frontmatter to SOF (\A) to prevent collisions with Markdown horizontal rules (---)
# Ignore LaTeX display ($$...$$) and non-greedy single-line inline math ($...$)
# Added regex to ignore HTML comments (<!-- -->) common in tech documentation
BlockIgnores = (?s)(```.*?```), (?s)(\A\s*//\s*Copyright.*?\n(?:\s*//[^\n]*\n)*)
TokenIgnores = (\$[^\$\n]+?\$)

# Severity Overrides
# Google strictly discourages first-person plural ("we", "us", "our").
# Escalated to 'warning' to enforce the actual Google Developer Style Guide.
Google.Passive = warning
Google.We = warning
Google.Wordiness = warning

# ==============================================================================
# Rust Source Code Comments (*.rs)
# ==============================================================================

[*.rs]
BasedOnStyles = Vale, Google

# Ignore fenced code blocks within rustdoc comments
BlockIgnores = (?s)(```.*?```), (?s)(\A(//.*?\n)+)
TokenIgnores = (SPDX-License-Identifier: [^\n]+), (http[s]?://[^\s]+)

# Technical prose adjustments
# Maintained lower severity for code comments, but kept 'Google.We' active as a suggestion.
# Google prefers "Calculates the offset" instead of "We calculate the offset" even in code.
Google.Passive = suggestion
Google.We = suggestion
Google.Wordiness = suggestion